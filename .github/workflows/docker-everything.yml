name: Build mcx-everything image
on:
  push:
    branches: [main]
    paths:
      - "mcx-everything/**"
      - ".github/workflows/docker-everything.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Resolve upstream pin
        id: pin
        run: |
          sha=$(git ls-remote https://github.com/HeyPuter/everything.git HEAD | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinning HeyPuter/everything at $sha"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: mcx-everything
          build-args: |
            EVERYTHING_REF=${{ steps.pin.outputs.sha }}
          push: true
          tags: |
            ghcr.io/ziqzav/mcx-everything:latest
            ghcr.io/ziqzav/mcx-everything:v1.0.0
