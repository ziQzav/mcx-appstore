name: Build mcx-mercury-agent image
on:
  push:
    branches: [main]
    paths:
      - "mcx-mercury-agent/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: mcx-mercury-agent
          push: true
          tags: |
            ghcr.io/ziqzav/mcx-mercury-agent:latest
            ghcr.io/ziqzav/mcx-mercury-agent:v1.4.2
