name: Build mcx-dsh-web image
on:
  push:
    branches: [main]
    paths:
      - "mcx-dsh-web/**"
      - ".github/workflows/docker-dsh-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: mcx-dsh-web
          platforms: linux/amd64
          push: true
          build-args: |
            DSH_VERSION=0.2.1-rc.5
            PLUGIN_VERSION=0.4.14
          tags: |
            ghcr.io/ziqzav/mcx-dsh-web:latest
            ghcr.io/ziqzav/mcx-dsh-web:v0.4.14
