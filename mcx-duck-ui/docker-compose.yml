version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: mcx-duck-ui_web_1
      APP_PORT: 5522

  web:
    image: ghcr.io/caioricciuti/duck-ui:latest@sha256:422478f52df5b623f38f6179b9de4decaec542d6136e5d97c8ba2badbb06d1bf
    init: true
    restart: on-failure
    environment:
      - DUCK_UI_ALLOW_UNSIGNED_EXTENSIONS=false