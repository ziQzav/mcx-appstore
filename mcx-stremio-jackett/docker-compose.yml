version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mcx-stremio-jackett_web_1
      APP_PORT: 7000

  web:
    image: docker.io/tsaridas/jackett-stremio:latest@sha256:5a630b17cfbfe7a12c41e589c6e31407494f6dd41dfaf8007f24a103e77f8f8c
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      - TZ=${TZ:-Europe/Istanbul}
      - PORT=7000
      # Jackett on this device. Trailing slash is required by the add-on.
      - JACKETT_HOSTS=${JACKETT_HOSTS:-http://100.68.199.76:9117/}
      # The API key is set in the app's own environment on the device so it is
      # never written into this public repository.
      - JACKETT_APIKEYS=${JACKETT_APIKEYS:-}
      - MIN_SEED=${MIN_SEED:-5}
      - MAX_RESULTS=${MAX_RESULTS:-5}
      - MAX_SIZE=${MAX_SIZE:-10GB}
      - SEARCH_BY_TYPE=${SEARCH_BY_TYPE:-true}
      - ADD_BEST_TRACKERS=true
    # Stateless: no volume, the add-on only talks to Jackett.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:7000/manifest.json"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
