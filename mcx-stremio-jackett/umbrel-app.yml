manifestVersion: 1
id: mcx-stremio-jackett
name: Stremio Jackett Addon
tagline: Stremio add-on that streams from your Jackett indexers
icon: https://github.com/tsaridas.png
category: media
version: "1.1.6"
port: 24686
description: >-
  A Stremio add-on that turns the Jackett indexers on this device into streams
  inside Stremio. It queries Jackett with an API key that is already configured,
  filters by seeders/size and returns magnet and torrent links to the Stremio
  player — no configuration page, no per-user setup.


  Use it: add http://umbrel.local:24686/manifest.json as an add-on in Stremio.
  Over Tailscale use the Tailscale address and the same /manifest.json path.


  Streaming: Stremio needs a torrent client or a debrid account for playback,
  exactly as with any other torrent add-on. This app only returns links.


  Access: umbrelOS login is disabled for this app on purpose, because Stremio
  clients fetch /manifest.json and /stream on their own and cannot sign in to
  umbrelOS. Keep the port on your LAN or Tailscale, never on the internet.


  Jackett: the add-on talks to the Jackett app at http://<umbrel-host>:9117/.
  The Jackett API key lives in this app's environment on the device, not in the
  store repository; if the key is rotated in Jackett, update it here.
developer: tsaridas
website: https://github.com/tsaridas/jackett-stremio
submitter: MCX
submission: https://github.com/tsaridas/jackett-stremio
repo: https://github.com/tsaridas/jackett-stremio
support: https://github.com/tsaridas/jackett-stremio/issues
gallery:
  - https://github.com/tsaridas.png
releaseNotes: >-
  1.1.6: MCX package of the tsaridas Jackett add-on (MIT), multi-arch image
  pinned by digest. It reads the Jackett host and API key from the app
  environment, so Stremio only needs the manifest URL. Umbrel login stays off so
  Stremio can fetch the manifest and streams; the port must stay on LAN or
  Tailscale.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
