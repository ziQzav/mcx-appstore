releaseNotes: >-
  4.2.7: initial MCX package of Stremio Jackett Addon, built from the upstream
  multi-arch image belmeg/stremio-addon-jackett:v4.2.7 pinned by digest. Serves
  the configure page and the addon on port 3000 behind the umbrelOS app proxy,
  with proxy login turned off after install so Stremio can fetch the manifest
  and streams. No local storage: the configuration lives in the install URL.
