version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mcx-dsh-web_web_1
      APP_PORT: 3080

  web:
    image: ghcr.io/ziqzav/mcx-dsh-web:v0.4.14-3@sha256:59c626c936fb6bfb065a9e9c25de4e632d34182cc15179731f92a07ed4424edc
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      # Optional: set a DeepSeek key here or add providers in the web UI.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DSH_HOME=/data
      - DSH_PORT=3079
      - PROXY_PORT=3080
      - DSH_TELEMETRY_DISABLED=1
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/workspace:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
