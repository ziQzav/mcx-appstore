  - https://raw.githubusercontent.com/zhu1090093659/dsh-web/main/docs/screenshots/04-git-graph.png
releaseNotes: >-
  0.4.14-3: rebuilt on the maintained smanx/deepseek-harness devtools base
  image instead of a hand-rolled node build. The base's proxy runs dsh on
  loopback and publishes 3080 with launch-token auto-login, so no socat and no
  login-token.txt any more, and Host is rewritten upstream so DSH_TRUSTED_HOST
  is no longer needed (the old entry still listed a stale LAN IP). Same DSH
  0.2.1-rc.5 and dsh-web 0.4.14. First start after updating reuses the existing
  /data profile; the leftover login-token.txt and dsh-startup.log files can be
  deleted.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
