gallery:
  - https://raw.githubusercontent.com/zhu1090093659/dsh-web/main/docs/screenshots/13-hero-main.png
  - https://raw.githubusercontent.com/zhu1090093659/dsh-web/main/docs/screenshots/09-task-board.png
  - https://raw.githubusercontent.com/zhu1090093659/dsh-web/main/docs/screenshots/04-git-graph.png
releaseNotes: >-
  Initial Umbrel release. Built here: node:24 image with DeepSeek Harness
  0.2.1-rc.5 and @linxin666/dsh-web-all 0.4.14 preinstalled on the web profile
  (the three native builds the plugin needs are allowed before install). The
  one-time login token is copied to data/login-token.txt on every start.
dependencies: []
