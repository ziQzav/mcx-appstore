manifestVersion: 1
id: mcx-dsh-web
name: DSH Web
tagline: DeepSeek Harness web GUI with the dsh-web plugin pack
icon: https://raw.githubusercontent.com/zhu1090093659/dsh-web/main/market/dist/tryon/shell/favicon.svg
category: ai
version: "0.4.14-3"
port: 24681
description: >-
  DeepSeek Harness (dsh) served as a web app, with the dsh-web plugin pack
  already mounted on the web profile: task board with cron and multi-agent
  runs, SSH/SFTP panel, git graph and per-session worktrees, session archive,
  token usage, theme and pet workshop, and the mobile bridge.


  Packaging: this image is a thin layer on top of the maintained community base
  image smanx/deepseek-harness (devtools variant), so dsh, node, pnpm, uv and
  the git/ssh/ffmpeg toolchain follow upstream. Only the plugin profile is
  added here.


  Login: the app opens directly. dsh runs on loopback and the base image's
  proxy publishes port 3080 to the app proxy, picking up the DSH launch token
  from the log and redeeming it for the session cookie on the first request.
  No token file to copy.


  Models: add a provider key in the app's Environment (DEEPSEEK_API_KEY) or in
  the web UI settings. Without a model the chat does nothing, but the board,
  files and plugins still load.


  Permissions: the container is the sandbox; agent commands run inside it.
  Only the app data folder and the workspace are mounted.


  Data: /data holds profiles, chats and settings, /workspace is where the
  agents work.
developer: zhu1090093659
website: https://github.com/zhu1090093659/dsh-web
submitter: MCX
submission: https://github.com/zhu1090093659/dsh-web
