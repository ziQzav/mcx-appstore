version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: mcx-hermes-workspace_workspace_1
      APP_PORT: 24676

  agent:
    image: nousresearch/hermes-agent:latest@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
    restart: on-failure
    command: ["gateway", "run"]
    environment:
      ANTHROPIC_API_KEY: ${APP_ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${APP_OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${APP_OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${APP_GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${APP_GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${APP_MISTRAL_API_KEY:-}
      HERMES_UID: "1000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_DASHBOARD_PORT: "9119"
      API_SERVER_KEY: ${APP_API_SERVER_KEY:-defaultkey}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_ENABLED: "true"
    volumes:
      - ${APP_DATA_DIR}/agent-data:/opt/data
  workspace:
    image: ghcr.io/outsourc-e/hermes-workspace:latest@sha256:1ec05339750da7caaf1cd0183c8c3b188856918b377407b4ac1dafca67e42d88
    init: true
    restart: on-failure
    depends_on:
      - agent
    environment:
      PORT: "24676"
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      HERMES_API_URL: http://agent:8642
      HERMES_DASHBOARD_URL: http://agent:9119
      HERMES_API_TOKEN: ${APP_API_SERVER_KEY:-defaultkey}
      HERMES_PASSWORD: ${APP_PASSWORD:-umbrel}
      COOKIE_SECURE: "0"
    volumes:
      - ${APP_DATA_DIR}/agent-data:/home/workspace/.hermes
      - ${APP_DATA_DIR}/files:/workspace
