description: >-
  Your AI agent's command center — chat, files, memory, skills, jobs, MCP,
  terminal, and a multi-agent control plane in one interface.


  Hermes Workspace runs on vanilla NousResearch hermes-agent (installed in
  the bundled agent container) and connects to its gateway automatically.


  Setup: after install, the workspace login password is the app password
  umbrelOS generated for this app. Add at least one LLM provider key to the
  agent config (via the workspace settings or terminal) before chatting.
