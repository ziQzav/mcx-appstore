description: >-
  A launcher for Claude Science, Anthropic's AI workbench for scientific
  research: it runs analyses end to end, records every step, and keeps the
  artefacts next to the question. This entry is a bookmark page, not a local
  install — Claude Science is a hosted beta (and a desktop download); nothing in
  this container analyses your data.


  Start: open the app, then "Open Claude Science" for the web product, or pick a
  macOS/Windows/Linux download. A Claude account is required, and the research
  features run on Anthropic's side.


  Licensing: Claude Science is Anthropic's product under Anthropic's terms; this
  page only links to it. The Linux build is a single x86_64 binary (~148 MB).
