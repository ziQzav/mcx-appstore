manifestVersion: 1
id: mcx-ignis
name: Ignis
tagline: Run Obsidian in your browser
icon: https://raw.githubusercontent.com/Nystik-gh/ignis/main/images/ignis.png
category: files
version: "0.8.18"
port: 24675
description: >-
  Ignis runs Obsidian in the browser — no remote desktop required.

  It is a compatibility shim that provides browser-compatible implementations
  of the Electron APIs used by Obsidian, so Obsidian runs in a standard
  browser while your vault stays on your umbrelOS server.


  The Docker container downloads Obsidian directly from its official source
  on first run, so give it a minute or two on the first start.


  With no vaults yet, Ignis opens the vault manager to create your first one.


  Note: Ignis has no built-in authentication. Keep your umbrelOS login
  requirement on for the app proxy (it is on by default), and do not expose
  the app port publicly.
