version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: mcx-mercury-agent_web_1
      APP_PORT: 24674

  web:
    image: ghcr.io/ziqzav/mcx-mercury-agent:v1.4.2@sha256:02e27659a3263e6df66fc2a9a4b624c0117702ba55d022929354a1447575ac2d
    init: true
    restart: on-failure
    environment:
      - MERCURY_HOME=/data/mercury
      - MERCURY_PORT=6174
    volumes:
      - ${APP_DATA_DIR}/mercury:/data/mercury
