manifestVersion: 1
id: mcx-ds-bot
name: DS Bot
tagline: A team of long-lived AI Bots on DeepSeek Harness
icon: https://raw.githubusercontent.com/Fei2411/DS-Bot/v0.2.6/docs/images/logo.svg
category: ai
version: "0.2.6"
port: 24679
description: >-
  DS Bot turns DeepSeek Harness into a team: you create Bots, talk to them,
  and they keep their own memory and workspace between sessions.


  This is the Docker build of DS Bot (dsh web + the ds-bot plugin), so it runs
  headless on the Umbrel and is used from the browser. Add a DeepSeek API key
  (or another Anthropic-Messages-compatible endpoint) in the app's Environment
  as DEEPSEEK_API_KEY; without a model key the Bots answer nothing.


  Login: the web UI asks for a one-time token. On every start the container
  writes it to Files -> Apps -> DS Bot -> data -> login-token.txt. Open
  http://umbrel.local:24679/?token=<the token from that file> once; the token
  sets a 30-day cookie and the plain address then opens the UI. If you open the
  app through another host name or IP, add it to DSH_TRUSTED_HOST in the app's
  Environment (otherwise the API answers 403).


  Permissions: the container is the sandbox. Bots run every command with full
  access inside it, and only the app data folder and the workspace are mounted.


  Data: /data holds the team, chats, settings and the cookie key; /workspace is
  where the Bots work.
