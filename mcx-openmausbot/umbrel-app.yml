  - https://raw.githubusercontent.com/milind-soni/OpenMausBot/master/public/app-icon-512.png
releaseNotes: >-
  0.1.149-2: a one-shot perms service hands /data to uid 1001 (maus) before the
  server starts; without it the container crash-looped on
  "EACCES: mkdir /data/.openmausbot". Container and image are unchanged.


  0.1.149: initial MCX package of the OpenMausBot harness server, built from
  the upstream multi-arch image ghcr.io/milind-soni/openmausbot pinned by
  digest. One container on port 8799 with OMB_LAN=1, data in /data, umbrelOS
  app login in front. Pair once with the MausBot app or a browser.
dependencies: []
