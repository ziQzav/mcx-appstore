releaseNotes: >-
  0.25.0: initial MCX package of IPTVnator (MIT), the official self-hosted PWA
  image pinned by digest (amd64 + arm64). nginx serves the Angular PWA and
  proxies /api to the bundled Express backend; source definitions live in the
  server database on /data. EPG/XMLTV views, external-player launching and the
  download manager are desktop-only and not part of this image. Umbrel login
  stays on; the app has no accounts of its own.
