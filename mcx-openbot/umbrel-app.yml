manifestVersion: 1
id: mcx-openbot
name: OpenBot
tagline: Local-first AI teammate workspace — headless server
icon: https://avatars.githubusercontent.com/u/100160810?s=200&v=4
category: ai
version: "0.51.1-2"
port: 3001
description: >-
  OpenBot by nightly-labs: a local-first workspace for persistent AI teammates.
  Every agent gets its own workspace and conversation, plus local queues,
  file transfers, an embedded browser and agent-to-agent messaging. It drives
  the Codex App Server, Claude Code, Grok, OpenCode, Gemini, Cursor CLI and
  Cline CLI through ACP.


  This is the HEADLESS SERVER, not a browser app. The container publishes no
  port: it only connects out. Use it from the OpenBot desktop app (macOS,
  Windows, Linux), the iPhone app, or openbot.run/app — the description page at
  this app's address explains the same thing.


  Setup: open the app's terminal and run `openbot login`, then enter your email
  and the one-time code. The server then appears in that account's server list;
  connect a provider from the app afterwards.


  Data lives in /data (database, logs, agent workspaces, downloaded provider
  runtimes, browser data).


  WARNING: this is a development preview. Agents run with full file, command and
  network access and never ask per action after the first-launch consent. Point
  it only at work you trust, and keep backups.


  Note: upstream ships a seccomp profile, but Umbrel copies only the compose and
  manifest into app-data, so this build runs with seccomp=unconfined plus
  no-new-privileges.


  License: PolyForm Noncommercial 1.0.0.
