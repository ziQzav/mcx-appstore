releaseNotes: >-
  0.64.0: track upstream v0.64.0 (was 0.61.0). New since 0.61: fixes for
  implicit state-machine races, open files named in a chat from mobile, no
  server-rail space in a chat window, browser-profile proxy management in the
  mobile app, ordered/pinned server-drawer tools, cookie-banner refusal in agent
  browser tabs, and a fresh Claude session when Claude Code cannot find the
  saved one. Container requirements are unchanged, so this is the image bump
  plus the version string. Earlier fixes kept: a one-shot perms service chowns
  /data to uid 1000, and the container runs with seccomp=unconfined,
  apparmor=unconfined and no-new-privileges.
  Upstream's container Dockerfile and compose are unchanged since 0.52.0, so
  this is the image bump plus the version string: no new ports, volumes or
  environment variables. Earlier fixes kept: a one-shot perms service chowns
  /data to uid 1000, and the container runs with seccomp=unconfined,
  apparmor=unconfined and no-new-privileges. The database migrates forward on
  first start, so this upgrade is one-way — back up the app data first.
dependencies: []
