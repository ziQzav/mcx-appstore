tagline: Self-hosted AI assistant your company owns
icon: https://avatars.githubusercontent.com/u/119687946?s=200&v=4
category: ai
version: "0.2.0"
port: 3001
description: >-
  The AI assistant your company can actually own — same shape as ChatGPT or
  Claude, but running on your infrastructure and fully changeable.


  Every coworker (Bot) gets a real browser of its own with its own logins
  and files, actions are decided before they happen and recorded after.
  Bring any AG-UI agent stack.


  Status: alpha — expect rough edges. Single-user mode is on by default
  (OPENBOT_SINGLE_USER=true): every request is admitted as one
  administrator. Before sharing with others, set up sign-in.


  To give a Bot a model, add OPENAI_API_KEY (or your provider's key) in
  the app's Environment. A CopilotKit Intelligence key enables the
  realtime voice features.
