releaseNotes: >-
  0.51.1-2: fix the container refusing to start with "User 1000 cannot write to
  /data". Umbrel creates the app-data folder under its own uid, while the image
  runs as uid 1000, so a one-shot perms service now chowns /data before the
  server starts. Also replaced the CopilotKit/openbot web server with the
  product that was actually meant: nightly-labs/openbot 0.51.1, run as the
  headless self-hosted server. The previous entry was a different project with
  the same name and required a CopilotKit Intelligence account to boot at all.
dependencies: []
path: ""
