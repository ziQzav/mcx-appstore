manifestVersion: 1
id: mcx-everything
name: Everything
tagline: 45 open-source web apps — Office, studios, games, business
icon: https://raw.githubusercontent.com/HeyPuter/everything/main/assets/everything.png
category: productivity
version: "1.1.0"
port: 8080
description: >-
  The Everything Project (github.com/HeyPuter/everything) rebuilds the world's
  software from scratch: Spreadsheet (Excel), Documents (Word), Presentation
  (PowerPoint), PDF, Notes, Email, Calendar, CRM, Accounting, Invoicing, CAD,
  Circuits, Chess, Backgammon, Checkers, Sudoku, Solitaire, Vector/Video/Audio/
  Music Studios and more — 45 apps in one container; the 5 that do not load
  upstream are not shipped.


  After install, open the app to see a hub page with every application. Apps
  that need a free Puter account and those that only run with sample data are
  labelled in the hub.


  All apps run fully in your browser; nothing leaves your umbrelOS.


  Note: the apps have no server-side authentication. Keep your umbrelOS login
  requirement on for the app proxy (it is on by default), and do not expose the
  app port publicly.
developer: HeyPuter
