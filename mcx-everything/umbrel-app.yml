manifestVersion: 1
id: mcx-everything
name: Everything
tagline: 50 open-source web apps — Office, studios, games, business
icon: https://raw.githubusercontent.com/HeyPuter/everything/main/assets/everything.png
category: productivity
version: "1.0.0"
port: 8080
description: >-
  The Everything Project (github.com/HeyPuter/everything) rebuilds the world's
  software from scratch: Spreadsheet (Excel), Documents (Word), Presentation
  (PowerPoint), Whiteboard (Miro), PDF, Notes, Email, Calendar, Contacts,
  Meetings, Photo/Video/Vector/Audio/Music/3D Studios, CAD, Circuits, Chess,
  Backgammon, Checkers, Sudoku, Solitaire, CRM, Accounting, Invoicing and more —
  50 apps in one container.


  After install, open the app to see a hub page with every application.


  All apps run fully in your browser; nothing leaves your umbrelOS.


  Note: the apps have no server-side authentication. Keep your umbrelOS login
  requirement on for the app proxy (it is on by default), and do not expose the
  app port publicly.
