releaseNotes: >-
  Hub now marks apps that need a Puter account and those that only run with
  sample data. The five apps that load a blank or stuck screen upstream (3D,
  Contacts, Meetings, Photo Studio, Whiteboard) are no longer shipped.
  Everything else unchanged.
