server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Large wasm/asset uploads for browser-only apps; nothing is executed server side.
    client_max_body_size 0;

    # ==== customHttp.yml, translated from AWS Amplify to nginx ====
    # / and *.html: no-cache (entry points must revalidate)
    location = / {
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        try_files /index.html =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri =404;
    }

    # hashed assets: immutable forever
    location ~* ^/apps/[^/]+/assets/ {
        # wasm needs the correct MIME type (circuits, parametric, music-studio)
        location ~* \.wasm$ {
            types { }
            default_type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # service workers / manifests / worker bundles: no-cache
    location ~* ^/apps/[^/]+/(sw\.js|manifest\.json|worker/.*)$ {
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri =404;
    }

    # hub page assets: revalidate
    location = /hub.js {
        add_header Cache-Control "no-cache" always;
    }

    # Default static handling for everything else.
    location / {
        try_files $uri $uri/ =404;
    }
}
